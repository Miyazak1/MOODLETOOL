<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OSSD Course Portal Login</title>
    <style>
      :root {
        color: #06244a;
        font-family: Arial, "Microsoft YaHei", sans-serif;
      }
      body {
        align-items: center;
        background: #f3f7fb;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }
      main {
        background: #ffffff;
        border: 1px solid #cfdaea;
        border-radius: 8px;
        box-shadow: 0 18px 45px rgba(8, 37, 74, 0.1);
        max-width: 420px;
        padding: 32px;
        width: calc(100% - 40px);
      }
      .eyebrow {
        color: #5c708f;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0;
        margin: 0 0 8px;
        text-transform: uppercase;
      }
      h1 {
        font-size: 26px;
        margin: 0 0 8px;
      }
      p {
        color: #4a5f7d;
        line-height: 1.6;
        margin: 0 0 24px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        margin: 16px 0 6px;
      }
      input {
        border: 1px solid #b9c7da;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 16px;
        height: 42px;
        padding: 0 12px;
        width: 100%;
      }
      button {
        background: #0a3d73;
        border: 0;
        border-radius: 6px;
        color: #ffffff;
        cursor: pointer;
        font-size: 16px;
        font-weight: 700;
        height: 42px;
        margin-top: 22px;
        width: 100%;
      }
      button:disabled {
        cursor: progress;
        opacity: 0.7;
      }
      .message {
        border-radius: 6px;
        display: none;
        font-size: 14px;
        margin-top: 16px;
        padding: 10px 12px;
      }
      .message.error {
        background: #fff1f1;
        color: #9b1c1c;
        display: block;
      }
      .message.ok {
        background: #edf9f2;
        color: #17633a;
        display: block;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">SunnyBrook OSSD</p>
      <h1>课程资源平台登录</h1>
      <p>请输入分配给你的账号。登录后只能查看已授权课程。</p>
      <form id="loginForm">
        <label for="username">Username</label>
        <input autocomplete="username" id="username" name="username" required />
        <label for="password">Password</label>
        <input autocomplete="current-password" id="password" name="password" required type="password" />
        <button id="submitButton" type="submit">登录</button>
        <div class="message" id="message"></div>
      </form>
    </main>
    <script>
      const form = document.getElementById("loginForm");
      const message = document.getElementById("message");
      const submitButton = document.getElementById("submitButton");

      function showMessage(text, type) {
        message.textContent = text;
        message.className = `message ${type}`;
      }

      fetch("/api/portal/session", { credentials: "same-origin" })
        .then((response) => response.json())
        .then((data) => {
          if (data.authenticated) window.location.href = "/";
        })
        .catch(() => {});

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submitButton.disabled = true;
        showMessage("正在登录...", "ok");
        const payload = {
          username: form.username.value,
          password: form.password.value,
        };
        try {
          const response = await fetch("/api/portal/login", {
            body: JSON.stringify(payload),
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            method: "POST",
          });
          const data = await response.json();
          if (!response.ok || !data.ok) throw new Error(data.error || "登录失败");
          window.location.href = "/";
        } catch (error) {
          showMessage(error instanceof Error ? error.message : "登录失败", "error");
        } finally {
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
