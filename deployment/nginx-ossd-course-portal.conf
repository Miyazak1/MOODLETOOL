# Example nginx config for OSSD Course Portal on Baota.
# Replace portal.example.com and filesystem paths before enabling.

server {
    listen 80;
    server_name portal.example.com;

    # Use HTTPS in production. Configure SSL in Baota or add listen 443 ssl here.

    client_max_body_size 4096m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_request_buffering off;

    # Internal courseware transport.
    # Browsers must never request this URL directly. Node checks login/course permission
    # first, then returns X-Accel-Redirect: /_protected_courseware/COURSE/...
    location /_protected_courseware/ {
        internal;
        alias /www/wwwroot/ossd-portal/courseware-active/;
        autoindex off;
        add_header Accept-Ranges bytes always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Courseware public URLs are still proxied to Node so file access stays protected.
    # Do not add alias/try_files here.
    location /courseware/ {
        proxy_pass http://127.0.0.1:8891;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin/API uploads can be large iSpring ZIPs.
    location /api/admin/ {
        proxy_pass http://127.0.0.1:8891;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # Default: proxy the private portal, login page, assets, and admin page to Node.
    location / {
        proxy_pass http://127.0.0.1:8891;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
